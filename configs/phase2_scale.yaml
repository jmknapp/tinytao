# Phase 2 target: ~10k networks on the 5060 Ti. Same scientific baseline.
task:
  name: modular_multiplication
  p: 13
  split: random
  train_frac: 0.7
  split_seed: 0

model:
  hidden_dims: [8]
  activation: relu
  use_bias: true
  init: xavier_uniform
  init_scale: 1.0

population:
  size: 10000
  min_size: 256

train:
  epochs: 200
  batch_size: 0
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  log_every: 20
  eval_every: 20

seed: 0
device: cuda
run_name: phase2_scale
notes: Scale/benchmark configuration. Short training; not a capacity sweep.
