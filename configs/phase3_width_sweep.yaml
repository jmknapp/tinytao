# Phase 3: width sweep on the fully enumerated multiplication table.
# Protocol is full_domain so "exact solver" measures whether a random
# initialization finds an implementation of the complete function, not
# whether it generalizes from a subset. The random-split protocol is a
# separate flag / follow-up.
task:
  name: modular_multiplication
  p: 13
  split: random
  train_frac: 0.7
  split_seed: 0

model:
  hidden_dims: [8]
  activation: relu
  use_bias: true
  init: xavier_uniform
  init_scale: 1.0

population:
  size: 1024
  min_size: 64

train:
  epochs: 8000
  batch_size: 0
  lr: 0.003
  optimizer: adam
  weight_decay: 0.0
  log_every: 50
  eval_every: 50

sweep:
  hidden_widths: [2, 3, 4, 5, 6, 8, 12, 16, 24, 32]
  protocol: full_domain
  depths: [1]

seed: 0
device: cuda
run_name: phase3_width_sweep
notes: >
  Controlled architecture sweep. Optimizer, seed family, activation, and
  protocol are fixed. Only hidden width changes.
