# Prospective H_CLASS2_MOD4 test. Identical Stage A H=1 Model C protocol.
# Prime list is overwritten in code; do not edit after training starts.
task:
  name: modular_multiplication_star
  p: 19
  split: held_row
  train_frac: 0.7
  split_seed: 0
  held_operands: [-1]

model:
  hidden_dims: [1]
  activation: identity
  use_bias: true
  init: xavier_uniform
  init_scale: 1.0
  interaction: complex

population:
  size: 1024
  min_size: 64

train:
  epochs: 8000
  batch_size: 0
  lr: 0.003
  optimizer: adam
  weight_decay: 0.0
  log_every: 50
  eval_every: 50

seed: 0
device: cuda
run_name: class2_mod4
notes: >
  Prospective out-of-sample test of H_CLASS2_MOD4.
  Same architecture, optimizer, epochs, population, held-row as Stage A.
  Primes locked: 19,23,31,29,37,41. No dlog init. No scramble. No Collatz.
