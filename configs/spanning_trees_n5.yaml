# Model K: Kirchhoff cofactor on all labeled graphs n=5.
# Preregistered before training.
task:
  name: spanning_tau
  p: 5
  split: held_edge
  train_frac: 0.7
  split_seed: 0
  held_operands: [0]

model:
  hidden_dims: [8]
  activation: identity
  use_bias: true
  init: xavier_uniform
  init_scale: 1.0
  interaction: kirchhoff

population:
  size: 1024
  min_size: 64

train:
  epochs: 8000
  batch_size: 0
  lr: 0.003
  optimizer: adam
  weight_decay: 0.0
  log_every: 50
  eval_every: 50

seed: 0
device: cuda
run_name: spanning_trees_n5
notes: >
  Held edge e=(0,1). Model K stacks the Laplacian cofactor.
  Do not raise n, add DC nets, or train 3n+1.
