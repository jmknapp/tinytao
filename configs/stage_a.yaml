# Stage A: Model C H=1 held-row across primes. p is overwritten in code.
task:
  name: modular_multiplication_star
  p: 7
  split: held_row
  train_frac: 0.7
  split_seed: 0
  held_operands: [-1]

model:
  hidden_dims: [1]
  activation: identity
  use_bias: true
  init: xavier_uniform
  init_scale: 1.0
  interaction: complex

population:
  size: 1024
  min_size: 64

train:
  epochs: 8000
  batch_size: 0
  lr: 0.003
  optimizer: adam
  weight_decay: 0.0
  log_every: 50
  eval_every: 50

seed: 0
device: cuda
run_name: stage_a_primes
notes: >
  Level 5 Stage A only. H=1 Model C, held-row a0=p-1.
  Train p=7,11,17. Attach existing p=13. Do not run Stage B/C/D.
