# Class-preserving holes on F_13*: hold one row or column of the
# multiplication table. All 12 product labels remain in train.
# held_operands: [12] is residue 12 (last nonzero).
task:
  name: modular_multiplication_star
  p: 13
  split: held_row
  train_frac: 0.7
  split_seed: 0
  held_operands: [12]

model:
  hidden_dims: [4]
  activation: relu
  use_bias: true
  init: xavier_uniform
  init_scale: 1.0
  interaction: add

population:
  size: 1024
  min_size: 64

train:
  epochs: 8000
  batch_size: 0
  lr: 0.003
  optimizer: adam
  weight_decay: 0.0
  log_every: 50
  eval_every: 50

seed: 0
device: cuda
run_name: held_row
notes: >
  Held row/column. Class-preserving structured hole.
  A/B have separate u,v; C shares e(a)=e(b).
