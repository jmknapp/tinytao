# Phase 1 baseline: one architecture, one optimizer, one random split.
# Nothing else is swept. The question is only whether a vectorized
# population can be trained and evaluated on the complete domain.
task:
  name: modular_multiplication
  p: 13
  split: random
  train_frac: 0.7
  split_seed: 0

model:
  hidden_dims: [8]
  activation: relu
  use_bias: true
  init: xavier_uniform
  init_scale: 1.0

population:
  size: 4096
  min_size: 64

train:
  epochs: 1500
  batch_size: 0          # full training set each step
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0
  log_every: 10
  eval_every: 10

seed: 0
device: cuda
run_name: phase1_modmul
notes: >
  Controlled baseline. Independent Xavier init is the only source of
  diversity. Do not interpret a lack of exact solvers as a negative
  result — Phase 3 varies capacity.
