# Phase 6 structured holdouts. Width 16 can implement the full table
# (Phase 3: 1024/1024 exact on full domain). The question is which
# holes in the table still allow a domain-exact rule to appear.
task:
  name: modular_multiplication
  p: 13
  split: random
  train_frac: 0.7
  split_seed: 0

model:
  hidden_dims: [16]
  activation: relu
  use_bias: true
  init: xavier_uniform
  init_scale: 1.0

population:
  size: 512
  min_size: 64

train:
  epochs: 8000
  batch_size: 0
  lr: 0.003
  optimizer: adam
  weight_decay: 0.0
  log_every: 100
  eval_every: 100

seed: 0
device: cuda
run_name: phase6_holdouts
notes: >
  One architecture, one optimizer. Only the training subset changes.
